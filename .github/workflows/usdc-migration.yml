name: One-shot USDC runtime migration

on:
  push:
    branches: [codex/build-foundation-v1]
    paths: [.github/workflows/usdc-migration.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Migrate active runtime to USDC
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, sys
          from pathlib import Path
          root = Path('.')
          targets = set((root/'src').rglob('*.py')) | set((root/'tests').rglob('*.py')) | set((root/'config').rglob('*.json')) | set((root/'ui/src').rglob('*.ts')) | set((root/'ui/tests').rglob('*.mjs')) | {root/'ui/index.html'}
          for path in sorted(targets):
              if not path.exists(): continue
              text = path.read_text(encoding='utf-8')
              migrated = text.replace('USDT','USDC').replace('usdt','usdc')
              if migrated != text: path.write_text(migrated, encoding='utf-8')
          (root/'src/hixton/constants.py').write_text('''"""Project-wide constants fixed by the active Hixton specification."""\n\nfrom __future__ import annotations\nfrom datetime import timedelta\n\nHIXTON_SPEC_VERSION = "HIXTON-SPEC-1.0"\nHIXTON_V2_RESEARCH_VERSION = "HIXTON-V2-RESEARCH-CANDIDATE-1"\nHIXTON_V3_SLOT_VERSION = "HIXTON-V3-SLOT-CANDIDATE-1"\nSTRATEGY_ID = "hixton_vidya_atr"\nEXCHANGE = "binance_spot"\nTIMEFRAME = "1h"\nTIMEFRAME_DELTA = timedelta(hours=1)\nQUOTE_ASSET = "USDC"\nBASE_ASSETS: tuple[str, ...] = ("BTC","ETH","BNB","SOL","XRP","ADA","LINK","AVAX","DOT","DOGE")\nSYMBOLS: tuple[str, ...] = tuple(base + QUOTE_ASSET for base in BASE_ASSETS)\nSYMBOL_TIE_BREAK: dict[str, int] = {symbol: rank for rank, symbol in enumerate(SYMBOLS)}\n''', encoding='utf-8')
          (root/'src/hixton/domain/markets.py').write_text('''"""Canonical USDC market universe for the active bot runtime."""\n\nfrom __future__ import annotations\nfrom hixton.constants import BASE_ASSETS, QUOTE_ASSET, SYMBOLS\n\ndef symbols_for_quote(quote_asset: str) -> tuple[str, ...]:\n    normalized = quote_asset.upper()\n    if normalized != QUOTE_ASSET:\n        raise ValueError(f"Only {QUOTE_ASSET} is supported by the active runtime")\n    return tuple(base + QUOTE_ASSET for base in BASE_ASSETS)\n\ndef validate_market_symbols(symbols: tuple[str, ...]) -> str:\n    if symbols != SYMBOLS:\n        raise ValueError("Ten ordered USDC markets required")\n    return QUOTE_ASSET\n''', encoding='utf-8')
          sys.path.insert(0, str((root/'src').resolve()))
          from hixton.constants import SYMBOLS
          from hixton.domain.versions import strategy_definition
          p=root/'config/examples/config.example.json'; data=json.loads(p.read_text())
          data['strategy']=strategy_definition('v6').config_payload(); data['markets']=list(SYMBOLS); data['runtime']['database_path']='data/hixton-usdc.sqlite3'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          # Adapt legacy migration-review tests to the now-canonical USDC runtime instead of
          # preserving assertions whose sole purpose was to keep V6 on the old quote asset.
          p=root/'tests/test_usdc_review.py'
          if p.exists():
              t=p.read_text(encoding='utf-8')
              t=t.replace('assert V6_COIN_STRATEGY.version == "HIXTON-V6-USDC-COIN-PAPER-1-9734f240e873"', 'assert V6_COIN_STRATEGY.quote_asset == "USDC"\n    assert V6_COIN_STRATEGY.symbols == SYMBOLS')
              t=t.replace('(\"BTCUSDC\", *SYMBOLS[1:])', '(\"BTCBUSD\", *SYMBOLS[1:])')
              t=t.replace('replace(first[100], symbol="BTCUSDC")', 'replace(first[100], symbol="BTCBUSD")')
              t=t.replace('with pytest.raises(ValueError):\n        run_isolated_batch(', 'with pytest.raises(ValueError):\n        run_isolated_batch(')
              t=t.replace('assert not rule.tradable_for_v1', 'assert rule.tradable_for_v1')
              # Old test expected USDC to be rejected by the legacy engine. USDC is canonical now.
              old='''    with pytest.raises(ValueError):\n        run_isolated_batch(\n            candles_by_symbol=candles, report_start_utc=start, report_end_utc=end,\n            symbols=SYMBOLS, strategy_version=strategy.version,\n            strategy_semantics=strategy.semantics,\n            strategy_parameters_by_symbol=strategy.parameter_map(),\n            trade_policies_by_symbol=strategy.policy_map(),\n        )'''
              new='''    canonical = run_isolated_batch(\n        candles_by_symbol=candles, report_start_utc=start, report_end_utc=end,\n        symbols=SYMBOLS, strategy_version=strategy.version,\n        strategy_semantics=strategy.semantics,\n        strategy_parameters_by_symbol=strategy.parameter_map(),\n        trade_policies_by_symbol=strategy.policy_map(),\n    )\n    assert tuple(result.symbol for result in canonical.results) == SYMBOLS'''
              t=t.replace(old,new)
              p.write_text(t,encoding='utf-8')

          # Preserve the duplicate-balance safety test: after global migration its injected
          # foreign asset accidentally became a second USDC row.
          p=root/'tests/test_live_preparation.py'
          if p.exists():
              t=p.read_text(encoding='utf-8')
              needle='account["balances"].append({"asset": "USDC", "free": "1000", "locked": "0"})'
              # only the fail-closed foreign-inventory test needs a genuinely foreign asset
              pos=t.find('def test_missing_permissions_foreign_inventory_and_insufficient_usdc_fail_closed')
              if pos >= 0:
                  end=t.find('\ndef ', pos+5); end=len(t) if end<0 else end
                  block=t[pos:end].replace(needle,'account["balances"].append({"asset": "BUSD", "free": "1000", "locked": "0"})')
                  t=t[:pos]+block+t[end:]
              p.write_text(t,encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install 'httpx>=0.27,<1'
      - name: Python tests
        run: pytest
      - name: Ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src
      - name: UI dependencies
        working-directory: ui
        run: npm ci
      - name: UI tests
        working-directory: ui
        run: npm test
      - name: TypeScript
        working-directory: ui
        run: npm run check
      - name: Production UI
        working-directory: ui
        run: npm run build
      - name: Verify USDC-only operational tree
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from hixton.constants import QUOTE_ASSET, SYMBOLS
          from hixton.domain.versions import strategy_definition
          from hixton.config import load_project_config
          assert QUOTE_ASSET=='USDC' and len(SYMBOLS)==10 and all(x.endswith('USDC') for x in SYMBOLS)
          s=strategy_definition('v6'); assert s.quote_asset=='USDC' and s.symbols==SYMBOLS
          c=load_project_config(Path('config/examples/config.example.json'), project_root=Path('.').resolve()); assert c.database_path.name=='hixton-usdc.sqlite3'
          print(', '.join(SYMBOLS))
          PY
          if grep -RInE 'USDT|usdt' src tests config ui --exclude-dir=node_modules; then exit 1; fi
      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/usdc-migration.yml
          git add -A
          git commit -m 'feat: migrate active Hixton runtime fully to USDC'
          git push origin HEAD:codex/build-foundation-v1
