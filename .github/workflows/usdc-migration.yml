name: One-shot USDC runtime migration
on:
  push:
    branches: [codex/build-foundation-v1]
    paths: [.github/workflows/usdc-migration.yml]
permissions: {contents: write}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/build-foundation-v1, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - name: Migrate runtime
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          r=Path('.')
          paths=set((r/'src').rglob('*.py'))|set((r/'tests').rglob('*.py'))|set((r/'config').rglob('*.json'))|set((r/'ui/src').rglob('*.ts'))|set((r/'ui/tests').rglob('*.mjs'))|{r/'ui/index.html'}
          for p in paths:
              if p.exists():
                  x=p.read_text(encoding='utf-8'); y=x.replace('USDT','USDC').replace('usdt','usdc')
                  if x!=y:p.write_text(y,encoding='utf-8')
          (r/'src/hixton/constants.py').write_text('''"""Project-wide constants fixed by the active Hixton specification."""\nfrom __future__ import annotations\nfrom datetime import timedelta\nHIXTON_SPEC_VERSION="HIXTON-SPEC-1.0"\nHIXTON_V2_RESEARCH_VERSION="HIXTON-V2-RESEARCH-CANDIDATE-1"\nHIXTON_V3_SLOT_VERSION="HIXTON-V3-SLOT-CANDIDATE-1"\nSTRATEGY_ID="hixton_vidya_atr"\nEXCHANGE="binance_spot"\nTIMEFRAME="1h"\nTIMEFRAME_DELTA=timedelta(hours=1)\nQUOTE_ASSET="USDC"\nBASE_ASSETS: tuple[str,...] = ("BTC","ETH","BNB","SOL","XRP","ADA","LINK","AVAX","DOT","DOGE")\nSYMBOLS: tuple[str,...] = tuple(base+QUOTE_ASSET for base in BASE_ASSETS)\nSYMBOL_TIE_BREAK: dict[str,int] = {symbol:rank for rank,symbol in enumerate(SYMBOLS)}\n''',encoding='utf-8')
          (r/'src/hixton/domain/markets.py').write_text('''"""Canonical USDC market universe for the active bot runtime."""\nfrom __future__ import annotations\nfrom hixton.constants import BASE_ASSETS,QUOTE_ASSET,SYMBOLS\ndef symbols_for_quote(quote_asset:str)->tuple[str,...]:\n    if quote_asset.upper()!=QUOTE_ASSET: raise ValueError(f"Only {QUOTE_ASSET} is supported by the active runtime")\n    return tuple(base+QUOTE_ASSET for base in BASE_ASSETS)\ndef validate_market_symbols(symbols:tuple[str,...])->str:\n    if symbols!=SYMBOLS: raise ValueError("Ten ordered USDC markets required")\n    return QUOTE_ASSET\n''',encoding='utf-8')
          sys.path.insert(0,str((r/'src').resolve()))
          from hixton.constants import SYMBOLS
          from hixton.domain.versions import strategy_definition
          p=r/'config/examples/config.example.json'; d=json.loads(p.read_text()); d['strategy']=strategy_definition('v6').config_payload(); d['markets']=list(SYMBOLS); d['runtime']['database_path']='data/hixton-usdc.sqlite3'; p.write_text(json.dumps(d,indent=2)+'\n')
          p=r/'tests/test_usdc_review.py'; t=p.read_text()
          import re
          t=re.sub(r'assert V6_COIN_STRATEGY\.version == "HIXTON-V6-COIN-PAPER-1-[0-9a-f]+"','assert V6_COIN_STRATEGY.quote_asset == "USDC"\n    assert V6_COIN_STRATEGY.symbols == SYMBOLS',t)
          t=t.replace('(\"BTCUSDC\", *SYMBOLS[1:])','(\"BTCBUSD\", *SYMBOLS[1:])').replace('replace(first[100], symbol="BTCUSDC")','replace(first[100], symbol="BTCBUSD")')
          t=t.replace('replace(rule, quote_asset="USDC").tradable_for_quote("USDC")','replace(rule, quote_asset="BUSD").tradable_for_quote("USDC")')
          marker='''    with pytest.raises(ValueError):\n        run_isolated_batch(\n            candles_by_symbol=candles, report_start_utc=start, report_end_utc=end,\n            symbols=SYMBOLS, strategy_version=strategy.version,\n            strategy_semantics=strategy.semantics,\n            strategy_parameters_by_symbol=strategy.parameter_map(),\n            trade_policies_by_symbol=strategy.policy_map(),\n        )'''
          replacement='''    canonical = run_isolated_batch(\n        candles_by_symbol=candles, report_start_utc=start, report_end_utc=end,\n        symbols=SYMBOLS, strategy_version=strategy.version,\n        strategy_semantics=strategy.semantics,\n        strategy_parameters_by_symbol=strategy.parameter_map(),\n        trade_policies_by_symbol=strategy.policy_map(),\n    )\n    assert tuple(result.symbol for result in canonical.results) == SYMBOLS'''
          t=t.replace(marker,replacement).replace('assert not rule.tradable_for_v1','assert rule.tradable_for_v1'); p.write_text(t)
          p=r/'tests/test_live_preparation.py'; t=p.read_text(); pos=t.find('def test_missing_permissions_foreign_inventory_and_insufficient_usdc_fail_closed'); end=t.find('\ndef ',pos+5) if pos>=0 else -1
          if pos>=0:
              if end<0:end=len(t)
              b=t[pos:end].replace('account["balances"].append({"asset": "USDC", "free": "1000", "locked": "0"})','account["balances"].append({"asset": "BUSD", "free": "1000", "locked": "0"})'); t=t[:pos]+b+t[end:]; p.write_text(t)
          PY
      - name: Python deps
        run: python -m pip install -e '.[dev]' && python -m pip install 'httpx>=0.27,<1'
      - name: Python tests
        run: pytest
      - name: Ruff
        run: ruff check src tests
      - name: mypy
        run: mypy src
      - name: UI deps
        working-directory: ui
        run: npm ci
      - name: UI tests
        working-directory: ui
        run: npm test
      - name: TypeScript
        working-directory: ui
        run: npm run check
      - name: UI build
        working-directory: ui
        run: npm run build
      - name: Verify USDC-only runtime
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from hixton.constants import QUOTE_ASSET,SYMBOLS
          from hixton.domain.versions import strategy_definition
          from hixton.config import load_project_config
          assert QUOTE_ASSET=='USDC' and len(SYMBOLS)==10 and all(s.endswith('USDC') for s in SYMBOLS)
          v=strategy_definition('v6'); assert v.quote_asset=='USDC' and v.symbols==SYMBOLS
          c=load_project_config(Path('config/examples/config.example.json'),project_root=Path('.').resolve()); assert c.database_path.name=='hixton-usdc.sqlite3'
          PY
          ! grep -RInE 'USDT|usdt' src tests config ui --exclude-dir=node_modules
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/usdc-migration.yml
          git add -A
          git commit -m 'feat: migrate active Hixton runtime fully to USDC'
          git push origin HEAD:codex/build-foundation-v1
