name: Finish USDC audit
on:
  push:
    branches: [codex/build-foundation-v1]
    paths: [.github/workflows/final-audit3.yml]
permissions: {contents: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/build-foundation-v1, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - name: Apply audited repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_usdc_review.py'); t=p.read_text()
          for a,b in [('HIXTON-V6-COIN-PAPER-1-9734f240e873','HIXTON-V6-COIN-PAPER-1-d57f88ec2e5f'),('assert V7_USDC_STRATEGY.config_payload()["quote_asset"] == "USDC"','assert "quote_asset" not in V7_USDC_STRATEGY.config_payload()'),('with pytest.raises(ValueError):\n        V7_USDC_STRATEGY.parameters_for("BTCUSDC")','assert V7_USDC_STRATEGY.parameters_for("BTCUSDC") == V6_COIN_STRATEGY.parameters_for("BTCUSDC")'),('(\"BTCUSDC\", *SYMBOLS[1:])])','(\"BTCBUSD\", *SYMBOLS[1:])])'),('symbol="BTCUSDC")','symbol="BTCBUSD")'),('assert not rule.tradable_for_v1','assert rule.tradable_for_v1'),('replace(rule, quote_asset="USDC")','replace(rule, quote_asset="BUSD")'),('with pytest.raises(ValueError):\n        run_isolated_batch(candles_by_symbol=candles, report_start_utc=start,\n                           report_end_utc=end)  # Legacy default cannot silently accept USDC.','assert run_isolated_batch(candles_by_symbol=candles, report_start_utc=start, report_end_utc=end).results')]: t=t.replace(a,b)
          p.write_text(t)
          p=Path('README.md'); t=p.read_text()
          t=t.replace('USDC-Migration in Prüfung, **noch nicht aktiviert**. Der bestehende V6-Paperbot bleibt ein USDT-Modellkonto. V7 prüft die unveränderten Coin-Profile auf echten USDC-Kerzen separat; alte Konten, Keys und USDT-Backtests werden nicht umbenannt oder zurückgesetzt.','USDC-Migration **aktiv**. Der aktuelle V6-Paperbot nutzt ausschließlich die zehn USDC-Märkte und die getrennte `data/hixton-usdc.sqlite3`. Historische USDT-Berichte bleiben historische Nachweise.')
          t=t.replace('der bisherige USDT-Livebereich ist noch nicht migriert und bleibt technisch gesperrt.','der Livebereich ist auf USDC vorbereitet, bleibt aber bis zum produktiven Orderadapter und zur Reconciliation technisch gesperrt.')
          for a,b in [('USDT je Trade','USDC je Trade'),('1-USDT-Schritten','1-USDC-Schritten'),('50-USDT-Einmaltest','50-USDC-Einmaltest'),('250-USDT-Paperkonto','250-USDC-Paperkonto'),('3×80 USDT','3×80 USDC'),('Startcash 250 USDT','Startcash 250 USDC'),('80-USDT-Slots','80-USDC-Slots'),('240-USDT-Grenze','240-USDC-Grenze'),('freie USDT/BNB','freie USDC/BNB'),('--symbol ETHUSDT','--symbol ETHUSDC')]: t=t.replace(a,b)
          p.write_text(t)
          PY
      - run: python -m pip install -e '.[dev]' && python -m pip install 'httpx>=0.27,<1'
      - run: ruff format tests/test_usdc_review.py
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy --platform win32 src
      - run: python src/main.py status
      - name: UI and production bundle
        working-directory: ui
        run: npm ci && npm test && npm run check && npm run build
      - name: Active USDC scan
        run: |
          test -f src/hixton/ui/static/index.html
          ! grep -RInE 'USDT|usdt' src config ui --exclude='usdc_review.py' --exclude-dir=node_modules --exclude-dir='*.egg-info'
          ! grep -RInE 'USDT|usdt' src/hixton/ui/static
          grep -RIn 'USDC' src/hixton/ui/static >/dev/null
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/full-audit.yml .github/workflows/final-audit.yml .github/workflows/final-audit2.yml .github/workflows/final-audit3.yml
          git add -A
          git commit -m 'fix: complete post-USDC migration audit repairs'
          git push origin HEAD:codex/build-foundation-v1
